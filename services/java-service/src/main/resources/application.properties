server.port=${PRICING_PORT:8102}
spring.application.name=pricing-service

# Fault-injection knobs, mirroring the Python upstream's environment variables so a
# demo can degrade either service the same way.
sentinel.fail-rate=${PRICING_FAIL_RATE:0.0}
sentinel.latency-ms=${PRICING_LATENCY_MS:0}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Tomcat's default is 200 threads. Pinned explicitly because thread-pool exhaustion
# under load is one of the failure modes this service exists to be able to show.
server.tomcat.threads.max=${PRICING_MAX_THREADS:200}
server.tomcat.accept-count=100
