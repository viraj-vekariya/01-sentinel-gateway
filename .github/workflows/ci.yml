name: sentinel-ci

# The pipeline proves three things that the README claims, rather than trusting them:
#   1. the C++ extension actually compiles on a clean machine
#   2. the gateway works BOTH with and without it - the fallback is real, not decorative
#   3. the Java upstream builds, so the polyglot claim is not aspirational

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build native extension
        run: python native/setup.py build_ext --inplace

      - name: Verify the extension loads and releases the GIL
        run: |
          python - <<'PY'
          import sentinel_native as sn
          r = sn.Registry(sn.Algorithm.TOKEN_BUCKET, 3, 1, 4)
          assert [r.check("a").allowed for _ in range(5)] == [True]*3 + [False]*2
          assert hasattr(r, "check_holding_gil"), "benchmark control arm missing"
          print("native ok", sn.__version__)
          PY

      - name: Tests (native backend)
        run: python -m pytest tests/ -q

      - name: Tests (pure-Python fallback)
        # Hide the extension and run again. If this fails, the "degrades gracefully
        # without a compiler" claim is false, and that claim is load-bearing for
        # anyone deploying this somewhere without a build toolchain.
        run: |
          mkdir -p /tmp/hidden && mv sentinel_native*.so /tmp/hidden/
          SENTINEL_LIMITER_BACKEND=python python -m pytest tests/ -q
          mv /tmp/hidden/sentinel_native*.so .

      - name: Benchmark (smoke)
        run: python bench/bench_ratelimit.py --quick

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - name: Build pricing service
        working-directory: services/java-service
        run: mvn -B -q package -DskipTests

  end-to-end:
    runs-on: ubuntu-latest
    needs: [python, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}

      - run: pip install -r requirements.txt
      - run: python native/setup.py build_ext --inplace

      - name: Start the full stack
        run: |
          python services/python-service/app.py &
          (cd services/java-service && mvn -B -q spring-boot:run) &
          python -m uvicorn gateway.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health >/dev/null && \
            curl -sf localhost:8101/health >/dev/null && \
            curl -sf localhost:8102/api/pricing/health >/dev/null && break
            sleep 2
          done

      - name: Drive traffic and assert the detector separates
        run: |
          python bench/demo_traffic.py
          python - <<'PY'
          import json, sys
          r = json.load(open("outputs/e2e_results.json"))
          sep = r["separation"]
          print(json.dumps(sep, indent=2))
          # These are the README's headline claims. If they stop holding, CI fails.
          #
          # The separation is asserted on the SUSTAINED margin, not the peak margin. The
          # gateway flags on the median of a client's recent scores, and peak-vs-peak is
          # diagnostic only - on a cold baseline almost any client produces one high
          # score, so the peak margin can read 0.04 on a run where nothing was falsely
          # flagged at all. Gating on it failed exactly that way.
          assert sep["scanner_flagged"], "the scanner was not detected"
          assert not sep["any_normal_client_flagged"], \
              f"false positive on {sep['normal_clients_flagged']}"
          assert sep["sustained_margin"] > 0.2, \
              f"sustained separation collapsed to {sep['sustained_margin']}"
          assert r["phases"]["burst"]["status_codes"].get("429", 0) > 20, \
              "rate limiter did not engage on the burst"
          print("e2e assertions passed")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: measured-results
          path: outputs/*.json
